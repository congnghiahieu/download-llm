[project]
name = "download-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.32.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "ruff>=0.16.8",
]


[tool.ruff]
exclude = ["node_modules/", ".agents/", ".venv/"]

[tool.pyrefly]
search-path = ["."]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
