[project]
name = "download-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.17.0",
]

[dependency-groups]
dev = [
    "pyrefly>=0.61.0",
    "ruff>=0.15.10",
]


[tool.ruff]
exclude = ["node_modules/", ".agents/", ".venv/"]

[tool.pyrefly]
search-path = ["."]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
